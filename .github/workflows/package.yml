name: Package

on:
    push:
        branches: [main]
        tags: ['v*']
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build-windows:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: lts/*
                  cache: pnpm
            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: x86_64-pc-windows-msvc
            - name: Rust cache
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Cache OCR models
              uses: actions/cache@v4
              with:
                  path: src-tauri/resources/paddle-ocr
                  key: paddle-ocr-${{ hashFiles('scripts/fetch-ocr-models.mjs') }}
            - name: Download OCR models
              run: node scripts/fetch-ocr-models.mjs
            - name: Copy MSVC runtime DLLs
              shell: pwsh
              run: |
                  $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
                  if (-not $vs) { throw "Visual Studio with VC tools not found" }
                  $redist = Get-ChildItem "$vs\VC\Redist\MSVC" -Directory | Where-Object { $_.Name -match '^\d+\.' } | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
                  if (-not $redist) { throw "VC redist directory not found under $vs" }
                  $crt = Get-ChildItem "$($redist.FullName)\x64" -Directory -Filter 'Microsoft.VC14*.CRT' | Select-Object -First 1
                  if (-not $crt) { throw "Microsoft.VC14*.CRT not found under $($redist.FullName)\x64" }
                  Write-Host "Using $($crt.FullName)"
                  foreach ($dll in 'msvcp140.dll', 'msvcp140_1.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
                      Copy-Item "$($crt.FullName)\$dll" src-tauri\ -ErrorAction Stop
                      (Get-Item "src-tauri\$dll").VersionInfo | Format-List FileName, FileVersion
                  }
            - name: Build NSIS installer
              run: pnpm tauri build -b nsis
            - name: Check OCR models are bundled
              shell: bash
              run: |
                  installer=$(ls src-tauri/target/release/bundle/nsis/*.exe | head -n 1)
                  listing=$(7z l "$installer")
                  for f in ch_PP-OCRv5_det_mobile.onnx ch_PP-OCRv5_rec_mobile.onnx ppocrv5_dict.txt; do
                      echo "$listing" | grep -q "$f" || { echo "::error::$f is missing from $installer"; exit 1; }
                  done
                  # MSVC runtime must sit next to Logos.exe at the installer root
                  for f in msvcp140.dll msvcp140_1.dll vcruntime140.dll vcruntime140_1.dll; do
                      echo "$listing" | grep -qiE "[[:space:]]$f\r?$" || { echo "::error::$f is missing from the root of $installer"; exit 1; }
                  done
                  ls -l "$installer"
            - name: Upload installer
              uses: actions/upload-artifact@v4
              with:
                  name: logos-windows-x64
                  path: src-tauri/target/release/bundle/nsis/*.exe
                  if-no-files-found: error
            - name: Create release
              if: startsWith(github.ref, 'refs/tags/v')
              uses: softprops/action-gh-release@v2
              with:
                  files: src-tauri/target/release/bundle/nsis/*.exe
                  generate_release_notes: true
